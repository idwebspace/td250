name: Build Telegram Desktop EXE (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      # =========================================================
      # --- 1. Setup VCPKG (DIHAPUS vcpkgTriplet) ---
      # =========================================================
      - name: Install VCPKG Dependencies
        uses: lukka/run-vcpkg@v11
        with:
          # vcpkgJsonGlob adalah input yang valid
          vcpkgJsonGlob: 'vcpkg.json' 
          # Baris ini dihapus: vcpkgTriplet: x64-windows 
          # VCPKG akan menentukan triplet dari vcpkg.json dan/atau environment

      # --- Lanjut dengan Instalasi Qt via aqtinstall ---
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install aqtinstall tool
        run: pip install aqtinstall

      - name: Run aqtinstall for Qt 6.5.3
        run: aqt install 6.5.3 windows desktop win64_msvc2019_64 -m qtbase --outputdir C:\Qt

      # --- 3. Konfigurasi Proyek (CMake) ---
      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.5.3/msvc2019_64" 

      # --- 4. Build Proyek ---
      - name: Build Project (Release Configuration)
        run: cmake --build build --config Release

      # --- 5. Packaging dan Install ---
      - name: Install (Copy build files to install directory)
        run: cmake --build build --target INSTALL --config Release

      # --- 6. Upload Hasil Build (Artifact) ---
      - name: Upload Telegram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: td250-build-windows-${{ github.sha }}
          path: build/install/Telegram/Telegram.exe
