name: Build Telegram Desktop EXE (Windows)

# ... (Bagian 'on:' dan 'jobs:build_windows' tetap sama) ...
on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      # --- 1. Setup VCPKG (Tetap Sama) ---
      - name: Install VCPKG Dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json' 
          vcpkgTriplet: x64-windows

      # --- 2. GANTI DENGAN ACTION QT BARU ---
      - name: Setup Qt 6.5.3 (New Action)
        # Menggunakan action yang berbeda.
        # Catatan: Beberapa action mungkin memerlukan konfigurasi yang sedikit berbeda.
        uses: fabio-p/setup-qt-action@v1 # Ganti jurgenleschner dengan fabio-p
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          # Jika Anda menghadapi masalah path di langkah CMake, 
          # coba tambahkan export: true jika didukung action tersebut.

      # --- 3. Konfigurasi Proyek (CMake) ---
      # CMAKE_PREFIX_PATH harus sesuai dengan path instalasi Qt yang dibuat oleh action baru.
      # Path default untuk fabio-p seringkali berada di C:/Qt/{version}/{target}
      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.5.3/msvc2019_64" # Sesuaikan jika action baru menaruh di path lain.

      # ... (Langkah-langkah Build, Install, dan Upload berikutnya tetap sama) ...
      - name: Build Project (Release Configuration)
        run: cmake --build build --config Release

      - name: Install (Copy build files to install directory)
        run: cmake --build build --target INSTALL --config Release

      - name: Upload Telegram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: td250-build-windows-${{ github.sha }}
          path: build/install/Telegram/Telegram.exe
