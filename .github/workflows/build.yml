name: Build Telegram Desktop EXE (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      # --- 1. Setup VCPKG (Tetap Sama) ---
      - name: Install VCPKG Dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json' 
          vcpkgTriplet: x64-windows

      # =========================================================
      # --- 2. GANTI DENGAN ACTION QT RESMI DAN STABIL ---
      # =========================================================
      - name: Setup Qt 6.5.3 (Official Action)
        uses: qt-project/setup-qt@v1 
        with:
          version: '6.5.3'
          target: 'desktop'
          host: 'windows'
          arch: 'win64_msvc2019_64' # Target arsitektur
          tools: 'qtbase' # Hanya instal modul dasar jika ini cukup

      # --- 3. Konfigurasi Proyek (CMake) ---
      # Catatan: Action resmi ini seharusnya mengatur path Qt secara otomatis.
      # Namun, kita tetap menyertakan -DCMAKE_PREFIX_PATH sebagai cadangan.
      - name: Configure CMake
        run: |
          # Dijalankan dalam lingkungan developer Visual Studio
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            # Path ini mungkin TIDAK dibutuhkan jika Action qt-project/setup-qt bekerja dengan baik
            # -DCMAKE_PREFIX_PATH="C:/Qt/6.5.3/msvc2019_64" 

      # --- 4. Build Proyek ---
      - name: Build Project (Release Configuration)
        run: cmake --build build --config Release

      # --- 5. Packaging dan Install ---
      - name: Install (Copy build files to install directory)
        run: cmake --build build --target INSTALL --config Release

      # --- 6. Upload Hasil Build (Artifact) ---
      - name: Upload Telegram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: td250-build-windows-${{ github.sha }}
          path: build/install/Telegram/Telegram.exe
