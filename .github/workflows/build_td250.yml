name: Build Telegram Desktop TD250 (Windows - Final Stabil)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      # =========================================================
      # 0. SETUP CODE & SUBMODULES (Fix Ada Error)
      # =========================================================
      - name: Checkout Code (Deep Fetch)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # Sangat penting untuk repositori besar dan submodul

      - name: Initialize Git Submodules for Dependencies
        run: git submodule update --init --recursive
        
      # =========================================================
      # 1. STABILISASI LINGKUNGAN (Mengatasi Masalah Toolchain)
      # =========================================================
      - name: Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          use-mamba: true
          python-version: 3.10 
          activate-environment: td-build
          
      # =========================================================
      # 2. SETUP VCPKG SECARA MANUAL
      # =========================================================
      - name: Setup VCPKG Manually (Clone & Checkout Baseline)
        shell: powershell
        run: |
          # Commit ID yang stabil
          $BaselineCommitId = "d6e83884399e2f897621c1f201e74f4b1d3032d8" 
          Write-Host "Mengkloning VCPKG dan Checkout Baseline $BaselineCommitId"

          git clone https://github.com/microsoft/vcpkg.git
          Set-Location vcpkg
          git checkout $BaselineCommitId
          .\bootstrap-vcpkg.bat
          Set-Location ${{ github.workspace }}

      - name: Install VCPKG Dependencies Manually
        shell: powershell
        run: |
          Write-Host "Menginstal dependensi VCPKG..."
          .\vcpkg\vcpkg.exe install --triplet x64-windows --host-triplet x64-windows

      # =========================================================
      # 3. SETUP QT SECARA MANUAL
      # =========================================================
      - name: Install Python 3 for aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install aqtinstall tool
        run: pip install aqtinstall

      - name: Run aqtinstall for Qt 6.5.3
        run: aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 --outputdir C:\Qt

      # =========================================================
      # 4. BUILD PROYEK (YAML FIX)
      # =========================================================
      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="C:/Qt/6.5.3/msvc2019_64"

      - name: Build Project (Release Configuration)
        run: cmake --build build --config Release

      - name: Install (Copy build files to install directory)
        run: cmake --build build --target INSTALL --config Release

      # =========================================================
      # 5. UPLOAD HASIL
      # =========================================================
      - name: Upload Telegram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: td250-build-windows-${{ github.sha }}
          path: build/install/Telegram/Telegram.exe
