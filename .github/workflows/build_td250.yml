name: Build Telegram Desktop TD250 (Windows - Stabil)

on:
  push:
    branches:
      - main  # Ganti dengan nama branch utama Anda
  workflow_dispatch: # Memungkinkan Anda menjalankan secara manual

jobs:
  build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      # =========================================================
      # 1. SETUP VCPKG SECARA MANUAL
      # =========================================================
      - name: Setup VCPKG Manually (Clone & Checkout Baseline)
        shell: powershell
        run: |
          # Commit ID yang lebih baru, untuk memastikan libtgvoip (jika ada) dan ports lain ditemukan.
          # Jika ID ini gagal lagi, ganti dengan yang PASTI ditemukan di GitHub VCPKG.
          $BaselineCommitId = "23d132e01f66d8e8b0b0a2345c67d890e1f2a345" 
          Write-Host "Mengkloning VCPKG dan Checkout Baseline $BaselineCommitId"

          git clone https://github.com/microsoft/vcpkg.git
          Set-Location vcpkg
          git checkout $BaselineCommitId
          .\bootstrap-vcpkg.bat
          Set-Location ${{ github.workspace }}

      - name: Install VCPKG Dependencies Manually
        shell: powershell
        run: |
          # Menginstal dependensi dari vcpkg.json (sekarang hanya openssl & zlib)
          Write-Host "Menginstal dependensi VCPKG..."
          .\vcpkg\vcpkg.exe install --triplet x64-windows --host-triplet x64-windows

      # =========================================================
      # 2. SETUP QT SECARA MANUAL (Memperbaiki Error aqtinstall)
      # =========================================================
      - name: Install Python 3 for aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install aqtinstall tool
        run: pip install aqtinstall

      # LANGKAH DEBUGGING: LANGKAH INI HANYA UNTUK MENCARI NAMA MODUL
      # LANGKAH INI MUNGKIN GAGAL TAPI AKAN MENCETAK DAFTAR MODUL DI LOG!
      - name: Debug: List available Qt modules (Cari Nama Modul yang Benar)
        run: aqt list-qt windows desktop --modules 6.5.3 win64_msvc2019_64
        # Kunci di log: Cari nama yang mirip qtbase (misalnya, qt.qt6.qtbase atau hanya qtbase)

      - name: Run aqtinstall for Qt 6.5.3 (Setelah Debug)
        # Urutan BENAR: Host OS, Target Platform, Version, Arch
        # Kita hapus parameter -m (module) karena penamaannya sering bermasalah.
        run: aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 --outputdir C:\Qt

      # =========================================================
      # 3. BUILD PROYEK
      # =========================================================
      - name: Configure CMake
        run: |
          # Menunjuk ke VCPKG toolchain dan path Qt yang diinstal
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.5.3/msvc2019_64" 

      - name: Build Project (Release Configuration)
        run: cmake --build build --config Release

      - name: Install (Copy build files to install directory)
        run: cmake --build build --target INSTALL --config Release

      # =========================================================
      # 4. UPLOAD HASIL
      # =========================================================
      - name: Upload Telegram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: td250-build-windows-${{ github.sha }}
          path: build/install/Telegram/Telegram.exe
